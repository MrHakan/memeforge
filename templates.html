<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Browse popular meme templates. Find the perfect template for your next meme.">
    <title>Meme Templates - MemeForge</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header class="header">
        <div class="header-content">
            <a href="index.html" class="logo">
                <span class="logo-icon">🔥</span>
                <span>MemeForge</span>
            </a>
            <nav class="nav-menu">
                <a href="templates.html" class="nav-btn active">
                    <span>📚</span> Templates
                </a>
                <a href="index.html" class="nav-btn primary">
                    <span>✨</span> Create Meme
                </a>
            </nav>
        </div>
    </header>

    <main class="gallery-container">
        <div class="gallery-header">
            <h1>Meme Templates</h1>
            <p>Blank customizable templates of the most popular trending and latest memes.
                All templates are completely free to use - no watermarks, no paywalls!</p>
        </div>

        <div class="gallery-tabs" id="category-tabs">
            <button class="tab-btn active" data-category="all">📋 All Templates</button>
            <button class="tab-btn" data-category="popular">🔥 Popular</button>
            <button class="tab-btn" data-category="classic">⭐ Classic</button>
            <button class="tab-btn" data-category="recent">🆕 Recent</button>
        </div>

        <div class="gallery-search">
            <input type="text" id="gallery-search" placeholder="Search all templates...">
            <button class="btn btn-secondary" id="search-btn">
                <span>🔍</span> Search
            </button>
        </div>

        <div class="gallery-stats" id="gallery-stats"
            style="margin-bottom: 1rem; color: var(--text-secondary); font-size: 0.9rem;">
            Loading templates...
        </div>

        <div class="gallery-grid" id="gallery-grid"></div>

        <button class="btn btn-secondary" id="load-more-gallery"
            style="width: 100%; margin-top: 1.5rem; display: none;">
            Load More Templates
        </button>
    </main>

    <div class="toast-container"></div>

    <script src="templates.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const galleryGrid = document.getElementById('gallery-grid');
            const searchInput = document.getElementById('gallery-search');
            const searchBtn = document.getElementById('search-btn');
            const categoryTabs = document.getElementById('category-tabs');
            const loadMoreBtn = document.getElementById('load-more-gallery');
            const galleryStats = document.getElementById('gallery-stats');

            let currentCategory = 'all';
            let displayCount = 24;

            function renderGallery(templates) {
                const displayed = templates.slice(0, displayCount);
                const hasMore = templates.length > displayCount;

                galleryStats.textContent = `Showing ${displayed.length} of ${templates.length} templates`;

                galleryGrid.innerHTML = displayed.map(template => `
                    <div class="gallery-item" data-id="${template.id}">
                        <div class="gallery-item-image">
                            <img src="${template.url}" alt="${template.name}" loading="lazy">
                        </div>
                        <div class="gallery-item-info">
                            <div class="gallery-item-name">${template.name}</div>
                            <button class="gallery-item-btn" data-id="${template.id}">Add Caption</button>
                        </div>
                    </div>
                `).join('');

                loadMoreBtn.style.display = hasMore ? 'block' : 'none';
                loadMoreBtn.textContent = `Load More (${displayed.length}/${templates.length})`;

                galleryGrid.querySelectorAll('.gallery-item-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        const id = btn.dataset.id;
                        window.location.href = `./?template=${id}`;
                    });
                });

                galleryGrid.querySelectorAll('.gallery-item').forEach(item => {
                    item.addEventListener('click', () => {
                        const id = item.dataset.id;
                        window.location.href = `./?template=${id}`;
                    });
                });
            }

            function getFilteredTemplates() {
                const query = searchInput.value.trim();
                let templates;

                if (query) {
                    templates = searchTemplates(query);
                } else if (currentCategory === 'all') {
                    templates = memeTemplates;
                } else {
                    templates = getTemplatesByCategory(currentCategory);
                }

                return templates;
            }

            function refreshGallery() {
                const templates = getFilteredTemplates();
                renderGallery(templates);
            }

            galleryGrid.innerHTML = '<div class="loading-templates" style="grid-column: 1/-1; text-align: center; padding: 3rem;">Loading templates from Imgflip...</div>';
            await fetchTemplates();

            refreshGallery();

            searchInput.addEventListener('input', () => {
                displayCount = 24;
                refreshGallery();
            });
            searchBtn.addEventListener('click', () => {
                displayCount = 24;
                refreshGallery();
            });

            categoryTabs.addEventListener('click', (e) => {
                if (e.target.classList.contains('tab-btn')) {
                    categoryTabs.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                    e.target.classList.add('active');

                    currentCategory = e.target.dataset.category;
                    displayCount = 24;
                    searchInput.value = '';
                    refreshGallery();
                }
            });

            loadMoreBtn.addEventListener('click', () => {
                displayCount += 24;
                refreshGallery();
            });
        });
    </script>
</body>

</html>
